site_name: pystreme
site_description: GPU-batched de novo motif discovery, in-process from Python
site_url: https://vmindel.github.io/pystreme/
repo_url: https://github.com/vmindel/pystreme
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

nav:
  - Overview: index.md
  - Usage guide: usage.md
  - Running on a cluster: cluster.md
  - Validation and benchmarks: benchmarks.md
  - Design document: design.md
  - API reference:
      - MotifDiscovery and Motif: api/discovery.md
      - Results, annotation, plots: api/results.md
      - Sequences, controls, scanning: api/core.md
      - Statistics, seeds, refinement: api/internals.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]
